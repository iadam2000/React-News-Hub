name: Ping Supabase to Prevent Pausing

on:
  schedule:
    - cron: '0 9 * * 1,4' # 09:00 UTC every Monday & Thursday
  workflow_dispatch: # allow manual runs

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout (not strictly needed for this, but kept from the guide)
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # Step 3: Install Supabase client
      - name: Install Supabase Client
        run: npm install @supabase/supabase-js --force

      # Step 4: Ping Supabase
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.NEXT_SERVICE_ROLE_KEY }}
          SUPABASE_TABLE: your_table
        run: |
          node -e "
          (async () => {
            try {
              const { createClient } = require('@supabase/supabase-js');
              const supabase = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_KEY);
              const { data, error } = await supabase.from(process.env.SUPABASE_TABLE).select('*').limit(1);
              if (error) throw error;
              console.log('Ping successful:', data?.length ?? 0);
            } catch (err) {
              console.error('Error pinging Supabase:', err.message);
              process.exit(1);
            }
          })();
          "
